<h3>Course List</h3>

<ul>
  <li *ngFor="let course of courses; let i = index">
    {{ i + 1 }}. {{ course }}
  </li>
</ul>

<button type="button" (click)="addStudent()">Add Student</button>

<table>
  <thead>
    <tr>
      <th>No</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Gender</th>
      <th>Course</th>
      <th>Score</th>
      <th>Result</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    <tr
      *ngFor="let student of students; let i = index; let first = first; let last = last; trackBy: trackByStudentId"
      [class.pass]="student.score >= 50"
      [class.fail]="student.score < 50"
      [class.first-row]="first"
      [class.last-row]="last"
    >
      <td>{{ i + 1 }}</td>
      <td>{{ student.fName }}</td>
      <td>{{ student.lName }}</td>
      <td>{{ student.gender }}</td>
      <td>{{ student.course }}</td>
      <td>{{ student.score }}</td>
      <td>{{ getResult(student.score) }}</td>
      <td>
        <button type="button" (click)="deleteStudent(student.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<p *ngIf="students.length === 0">
  No students found.
</p>
