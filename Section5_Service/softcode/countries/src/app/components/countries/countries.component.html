<h1>Table List Country</h1>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Capital</th>
            <th>Region</th>
            <th>Calling Codes</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let c of data">
            <td>{{c.name}}</td>
            <td>{{c.capital}}</td>
            <td>{{c.region}}</td>
            <td>{{c.callingCodes[0]}}</td>
        </tr>
    </tbody>

</table>
